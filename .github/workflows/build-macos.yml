name: Build Pear Desktop (macOS Intel & ARM)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "11"
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── macOS Intel ───────────────────────────────────────────
          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            arch_label: Intel x64
            build_script: dist:mac

          # ─── macOS Apple Silicon ───────────────────────────────────
          - runs_on: macos-15
            platform: mac
            arch: arm64
            arch_label: Apple Silicon ARM64
            build_script: dist:mac:arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect Runner Environment
        shell: bash
        run: |
          echo "=========================================="
          echo "Runner Name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
          echo "Target Arch : ${{ matrix.arch }}"
          echo "System Arch : $(uname -m)"
          sw_vers || true
          echo "=========================================="

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup NodeJS for macOS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG (${{ matrix.arch_label }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building Pear Desktop for macOS ${{ matrix.arch }} using '${{ matrix.build_script }}'..."
          pnpm ${{ matrix.build_script }}

      - name: Verify Output Files
        shell: bash
        run: |
          echo "=== Content of pack/ directory ==="
          ls -lh pack/

      - name: Upload macOS Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-macos-${{ matrix.arch }}
          path: |
            pack/*.dmg
            pack/*.zip
            pack/*.blockmap
          if-no-files-found: error
