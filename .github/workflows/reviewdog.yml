name: reviewdog

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, atau commit SHA yang ingin di-lint (contoh: master, v3.11.8)'
        required: false
        default: 'master'
        type: string

env:
  NODE_VERSION: "24.x"

jobs:
  oxlint:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    name: runner / oxlint
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Checkout PR source files
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: src
          path: __pr_src

      - name: Overlay PR source
        if: github.event_name == 'pull_request_target'
        run: |
          rm -rf src
          cp -r __pr_src/src src
          rm -rf __pr_src

      - name: Setup reviewdog
        uses: reviewdog/action-setup@3f401fe1d58fe77e10d665ab713057375e39b887 # v1.3.0
        with:
          reviewdog_version: latest

      - name: Run oxlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPORTER="github-check"
            FILTER_MODE="nofilter"
          else
            REPORTER="github-pr-review"
            FILTER_MODE="file"
          fi

          pnpm exec oxlint src --format=checkstyle |
            reviewdog \
              -f=checkstyle \
              -name=oxlint \
              -reporter="$REPORTER" \
              -filter-mode="$FILTER_MODE" \
              -fail-level=error \
              -tee
