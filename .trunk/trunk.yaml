# Ahis file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@18.12.1
    - python@3.10.8
    - rust@1.71.1
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.6.9
    - checkov@3.3.21
    - git-diff-check
    - markdownlint@0.49.1
    - nixpkgs-fmt@1.3.0
    - osv-scanner@1.3.6
    - oxipng@7.0.0
    - prettier@3.9.9
    - renovate@44.126.0
    - svgo@4.1.0
    - trivy@0.37.1
    - trufflehog@3.31.3
    - yamllint@1.38.0
