<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cannot load Pear Desktop</title>
    <style>
      body {
        background: #000;
      }

      .container {
        margin: 0;
        font-family: Roboto, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        position: absolute;
        top: 50%;
        left: 50%;
        margin-right: -50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .button {
        background: #065fd4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: white;
        font: inherit;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        font-size: 16px;
        font-weight: normal;
        text-align: center;
        padding: 8px 22px;
        display: inline-block;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p>Cannot load Pear Desktop… Internet disconnected?</p>
      <button type="button" class="button" onclick="reload()">Retry</button>
    </div>
  </body>
</html>
