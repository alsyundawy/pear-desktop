<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ReVanced Signature Gradient: Magenta -> Purple -> Cyan -->
    <linearGradient id="revancedGlowRing" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="45%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- YouTube Music Signature Red Gradient -->
    <radialGradient id="ytmRedDisc" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="85%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#B80000" />
    </radialGradient>

    <!-- Outer Ring Neon Glow Filter -->
    <filter id="neonRingGlow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Red Disc Drop Shadow Filter -->
    <filter id="discShadow" x="120" y="120" width="784" height="784" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Pear Emblem Shadow Filter -->
    <filter id="emblemShadow" x="250" y="200" width="524" height="600" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Base Circle -->
  <circle cx="512" cy="512" r="500" fill="#0A0B0E" />

  <!-- ReVanced Outer Neon Gradient Ring -->
  <circle cx="512" cy="512" r="446" stroke="url(#revancedGlowRing)" stroke-width="26" fill="none" filter="url(#neonRingGlow)" />

  <!-- YouTube Music Central Red Disc -->
  <g filter="url(#discShadow)">
    <circle cx="512" cy="512" r="378" fill="url(#ytmRedDisc)" />
    <circle cx="512" cy="512" r="376" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" fill="none" />
  </g>

  <!-- Central Pear Fruit Emblem with Play Button -->
  <g filter="url(#emblemShadow)">
    <!-- Pear Leaf & Stem -->
    <path d="M492 278 C492 278 458 274 446 304 C434 334 466 350 492 350 C518 350 514 316 492 278 Z" fill="#FFFFFF" />
    <path d="M504 354 C506 322 522 284 546 274 C548 273 550 277 548 281 C532 305 522 328 518 354 Z" fill="#FFFFFF" />

    <!-- Left Half of Pear -->
    <path d="M486 364 L486 462 C458 462 432 478 418 504 C402 534 402 572 418 602 C432 628 458 644 486 644 L486 678 C424 678 356 646 356 558 C356 496 394 456 422 412 C444 378 466 364 486 364 Z" fill="#FFFFFF" />

    <!-- Right Half of Pear -->
    <path d="M538 364 L538 462 C544 462 550 464 556 468 C582 484 602 516 602 554 C602 590 582 622 556 638 C550 642 544 644 538 644 L538 678 C600 678 668 646 668 558 C668 496 630 456 602 412 C580 378 558 364 538 364 Z" fill="#FFFFFF" />

    <!-- YouTube Music Play Button Triangle in Center -->
    <path d="M462 466 C462 458 471 453 478 457 L586 518 C593 522 593 532 586 536 L478 597 C471 601 462 596 462 588 Z" fill="#FFFFFF" />
  </g>
</svg>