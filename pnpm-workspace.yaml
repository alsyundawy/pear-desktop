allowBuilds:
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
  utf-8-validate: true
overrides:
  # --- Node.js tooling ---
  node-gyp: 13.0.2
  xml2js: 0.6.2
  node-fetch: 3.3.2
  '@electron/universal': 3.0.6

  # --- Babel runtime ---
  '@babel/runtime': 8.0.0
  '@babel/core': ^7.29.6

  # --- XML / YAML / TOML parsers ---
  '@xmldom/xmldom@<0.8.15': 0.8.15
  js-yaml@<4.3.2: 4.3.2
  toml@<4.2.0: 4.3.0

  # --- URL / network security ---
  tar: '>=7.5.21'
  fast-uri: '>=3.1.8'
  undici: '>=7.29.0'
  ip-address@<10.2.1: 10.7.2

  # --- IDs / crypto ---
  nanoid@<3.3.19: 3.3.19
  uuid@13: '>=13.0.1'

  # --- CSS post-processing ---
  postcss: '>=8.5.23'

  # --- Temp files ---
  tmp: '>=0.2.6'

  # --- Browser compatibility ---
  browserslist@<4.28.7: 4.29.1
  baseline-browser-mapping@<2.11.0: 2.11.26

  # --- SECURITY: minimatch ReDoS (CVE-2026-27903, CVE-2026-27904, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74) ---
  # Affects all major release lines; fix: >=3.1.4, >=5.1.8, >=9.0.7, >=10.2.3
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=5.0.0 <5.1.8': 5.1.8
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'minimatch@>=10.0.0 <10.2.3': 10.2.3

  # --- SECURITY: brace-expansion DoS (CVE-2026-102278, CVE-2026-69152, CVE-2026-14257, GHSA-q2hr-2g5m-vwhr) ---
  # Fix: >=1.1.21, >=2.1.7, >=3.0.8, >=4.x→5.0.12, >=5.0.12
  'brace-expansion@<2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=3.0.0 <3.0.8': 3.0.8
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12

  # --- SECURITY: form-data CRLF injection (CVE-2026-12143, GHSA-hmw2-7cc7-3qxx) ---
  # Affects: >=4.0.0 <4.0.6; Fix: >=4.0.6
  'form-data@>=4.0.0 <4.0.6': 4.0.6

  # --- SECURITY: ajv ReDoS via $data option (CVE-2025-69873, GHSA-2g4f-4pwh-qvx6) ---
  # ajv v6 fix: >=6.14.0; ajv v8 fix: >=8.18.0
  'ajv@<6.14.0': 6.14.0
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.18.0

  # --- SECURITY: file-type infinite loop in ASF parser (CVE-2026-31808, GHSA-5v7r-6r5c-r473) ---
  # Affects: >=13.0.0 <21.3.1; Fix: >=21.3.1
  'file-type@<21.3.1': 21.3.4

patchedDependencies:
  vudio@2.1.1: patches/vudio@2.1.1.patch
  '@malept/flatpak-bundler@0.4.0': patches/@malept__flatpak-bundler@0.4.0.patch
  kuromoji@0.1.2: patches/kuromoji@0.1.2.patch
  electron-is@3.0.0: patches/electron-is@3.0.0.patch
  mdui@2.1.5: patches/mdui@2.1.5.patch
